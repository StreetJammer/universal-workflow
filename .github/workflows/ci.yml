name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate package
        run: python scripts/validate_package.py
      - name: Runtime integration checks
        run: python -m unittest discover -s skills/universal-workflow/scripts -p "test_*.py" -v
      - name: PR watcher regression checks
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: PR watcher live API smoke check
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_REPO: ${{ github.repository }}
          WATCH_PR: ${{ github.event.pull_request.number }}
        run: |
          set +e
          python scripts/pr_watch.py --repo "$WATCH_REPO" --pr "$WATCH_PR" --once --json
          result=$?
          # Pending/blocked is expected while this PR's own checks/review run.
          case "$result" in
            0|1|3) exit 0 ;;
            *) exit "$result" ;;
          esac
